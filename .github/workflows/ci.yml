name: Ephemeral QA Regression Gatekeeper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ephemeral-qa-gatekeeper:
    name: Ephemeral Playwright Contract Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Agent Swarm Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Build & Run Ephemeral Sandbox Containers
        run: |
          docker compose up -d --build
          docker compose exec -T target-mcp-api curl -f http://localhost:8000/health

      - name: Teardown Sandbox
        if: always()
        run: |
          docker compose down -v
